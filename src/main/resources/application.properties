# Name of the Spring Boot application
spring.application.name=Introduction-To-SpringBoot

# Sets the port where the app will run (default is 8080)
server.port=7311

# Sets the time zone for JSON date handling
spring.jackson.time-zone=GMT+3

# Database connection URL (PostgreSQL on localhost, port 5432, database 'postgres')
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/intro_to_spring

# Database password
spring.datasource.password=dev

# Database username
spring.datasource.username=postgres

# Automatically updates database schema (tables) based on entities
spring.jpa.hibernate.ddl-auto=update

# Sets detailed logging for web request debugging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG